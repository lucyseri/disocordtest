<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord</title>
  <!-- script -->
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/js_index.js" defer></script>
  <!-- style -->
  <link rel="stylesheet" href="css/pages/index.css">
</head>
<body>
  <div id="wrap">
    <div id="header-include"></div>
    <main>
      <section class="title">
        <h1>Messages</h1>
        <ul>
          <li><a href="#"><span class="ir_wa">search</span></a></li>
          <li><a href="#"><span class="icon"></span>Add Friends</a></li>
        </ul>
      </section>
      <section class="fiexd-thum">
        <h2>fiexed thum</h2>
        <ul>
          <li class="active">
            <a href="#">
              <span class="profile-img">
                <img src="img/profile1.png" alt="profile1">
                <span class="badge"><span class="badge-inner"></span></span>
              </span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="profile-img">
                <img src="img/profile2.png" alt="profile2">
                <span class="badge"><span class="badge-inner"></span></span>
              </span>
            </a>
          </li>
        </ul>
      </section>
      <section class="message-list">
        <h2>friends list</h2>
        <ul>
          <li>
            <a href="#">
              <div class="friends-info">
                <span class="thum">
                  <img src="img/profile2.png" alt="profile2">
                  <span class="badge"><span class="badge-inner"></span></span>
                </span>
                <span class="name">
                  <strong>Oliver!</strong>
                </span>
              </div>
              <span class="time">1m</span>
            </a>
          </li>
          <li class="active">
            <a href="#">
              <div class="friends-info">
                <span class="thum">
                  <img src="img/profile1.png" alt="profile1">
                  <span class="badge"><span class="badge-inner"></span></span>
                </span>
                <span class="name">
                  <strong>Alex</strong>
                  Call Ended
                </span>
              </div>
              <span class="time">23m</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <div class="quick-menu"><img src="img/chat-plus.svg" alt="more chat"></div>
    <div id="tabBar-include"></div>
    </div>
</body>
</html>
