<!DOCTYPE html>
<html lang="ko">
<head>

  <!-- script -->

  <!-- style -->
  <link rel="stylesheet" href="css/pages/index.css">

<body>
  <div id="wrap">
    <header>
      <nav>
        <ul>
          <li class="active"><a href="#"><span class="ir_wa">messages</span></a></li>
          <li class="alarm"><a href="#"><span class="ir_wa">profile</span></a></li>
          <li><a href="#"><span class="ir_wa">pluse</span></a></li>

    <main>
      <section class="title">
        <h1>Messages</h1>
        <ul>
          <li><a href="#"><span class="ir_wa">search</span></a></li>

      <section class="fiexd-thum">

        <ul>
          <li>
            <a href="#">
              <img src="" alt="">
            </a>
          </li>
        </ul>

      <section class="list">
        <h2>friends list</h2>
        <ul>
          <li>
            <a href="#">
              <div class="friend-info">
                <img src="" alt="">
                <span>

    <div id="tabBar-include"></div>
