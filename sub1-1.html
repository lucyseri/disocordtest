<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>home profile</title>
  <!-- script -->
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/js_sub1-1.js" defer></script>
  <!-- style -->
  <link rel="stylesheet" href="css/pages/sub1-1.css">
</head>
<body>
  <div id="wrap">
    <div id="header-include"></div>
    <main>
      <div id="back-img"><img src="img/back.png" alt="back img"></div>
      <section class="title">
        <h1>
          <a href="#">
            Design Buddies
            <span class="badge"><img src="img/badge.svg" alt="badge"></span>
            <span class="more-btn"><img src="img/chevron-right.svg" alt="more"></span>
          </a>
        </h1>
        <div class="member-state">
          <p>82,222 Members</p>
          <span class="dot"></span>
          <p>Community</p>
        </div>
        <div class="btn-box">
          <a href="#" class="search-btn"><span class="search-icon"></span>Search</a>
          <a href="#" class="plus-btn"><span class="ir_wa">plus</span></a>
          <a href="#" class="schedule-btn"><span class="ir_wa">schedule</span></a>
        </div>
      </section>
      <section class="server-guide">
        <h2><span class="icon"></span>server guide</h2>
        <ul>
          <li class="add-dot">
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>Channels & Roles</span>
              <span class="badge new">NEW</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>about-and-links</span>
              <span class="badge"></span>
            </a>
          </li>
          <li class="add-dot">
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>Announcements</span>
              <span class="badge num">1</span>
            </a>
          </li>
        </ul>
      </section>
      <section class="onboarding slide-menu">
        <h2>Onboarding<button class="down-arrow"><span class="ir_su">more</span></button></h2>
        <ul>
          <li class="add-dot">
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>rules</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>where-to-post</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>welcome</span>
            </a>
          </li>
          <li class="add-dot">
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>introductions</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>perks</span>
            </a>
          </li>
        </ul>
      </section>
      <section class="general-discussion slide-menu">
        <h2 class="toggle-menu">General Discussion<button class="down-arrow"><span class="ir_su">more</span></button></h2>
        <ul class="toggle-menu">
          <li>
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>general</span>
            </a>
          </li>
          <li class="add-dot">
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>design</span>
            </a>
          </li>
          <li class="add-dot">
            <a href="#">
              <span class="dot"></span>
              <span class="txt"><span class="icon"></span>emotional-support-group</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <div id="tabBar-include"></div>
  </div>
</body>
</html>
