<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>you</title>
  <!-- script -->
  <script src="js/jquery-3.7.1.min.js"></script>
  <script src="js/js_sub3.js" defer></script>
  <!-- style -->
  <link rel="stylesheet" href="css/pages/sub3.css">
</head>
<body>
  <div id="wrap">
    <header>
      <a href="#" class="home-btn"><span class="back"><span class="ir_wa">home</span></span></a>
      <a href="#" class="nitro-btn"><span class="icon"></span>Nitro</a>
      <a href="#" class="setting-btn"><span class="back"><span class="ir_wa">setting</span></span></a>
    </header>
    <main>
      <section class="profile">
        <h1 class="ir_pm">profile</h1>
        <div class="profile-img-state">
          <span class="profile-img">
            <img src="img/profile3.png" alt="profile">
            <span class="state"></span>
          </span>
          <a href="#" class="add-btn">
            <span class="icon"></span>
            Add Status
          </a>
        </div>
        <div class="profile-name">
          <h2>
            <span class="name">Sam <img src="img/chevron-down.svg" alt="more"></span>
            <span class="id">sam021778</span>
          </h2>
        </div>
        <a href="#" class="edit-btn"><span class="icon"></span>Edit Profile</a>
      </section>
      <section class="shop">
        <div class="sec-inner">
          <div class="title">
            <h2>Amp up your profile</h2>
            <span class="close-btn"><span class="ir_su">x</span></span>
          </div>
          <div class="btn-box">
            <a href="#" class="nitro">
              <span class="icon"></span>
              <span class="txt">Get Nitro</span>
            </a>
            <a href="#" class="shop">
              <span class="icon"></span>
              <span class="txt">Shop</span>
            </a>
          </div>
        </div>
      </section>
      <section class="start-date white-back">
        <a href="#" class="sec-box">
          <h2>Member Since</h2>
          <span class="txt"><span class="icon"></span>Sep 2, 2025</span>
        </a>
      </section>
      <section class="friends white-back">
        <a href="#" class="sec-box">
          <h2>Your Friends</h2>
          <span class="icon"></span>
        </a>
      </section>
      <section class="note white-back">
        <a href="#" class="sec-box">
          <h2>Note (only visible to you)</h2>
          <span class="icon"></span>
        </a>
      </section>
    </main>
    <div id="tabBar-include"></div>
  </div>
</body>
</html>
